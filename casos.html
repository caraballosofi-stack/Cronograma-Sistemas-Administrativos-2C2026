<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casos Prácticos · Sistemas Administrativos · 2C 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#003575; --navy-deep:#001F45; --gold:#F2BC42; --gold-deep:#C9922A;
    --celeste:#EAF2F8; --celeste-line:#B9D3E8; --ink:#182333; --slate:#5B6B82;
    --slate-soft:#8B97A8; --paper:#FBFAF6; --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
  }
  header{
    background:var(--navy); padding:36px 24px 44px; position:relative; text-align:center;
  }
  .backlink{
    position:absolute; left:20px; top:20px; color:var(--celeste-line);
    text-decoration:none; font-size:13px; font-weight:600;
  }
  .backlink:hover{ color:var(--white); }
  .eyebrow{
    text-transform:uppercase; letter-spacing:0.14em; font-size:12px; font-weight:700;
    color:var(--gold); margin:0 0 8px;
  }
  h1{
    font-family:'Lora',serif; font-size:30px; font-weight:600; color:var(--white); margin:0;
  }
  main{
    max-width:720px; margin:-24px auto 40px; padding:0 20px;
  }
  .item{
    background:var(--white); border-radius:16px; box-shadow:0 10px 30px rgba(0,15,40,0.1);
    padding:22px 24px; margin-bottom:18px; position:relative; overflow:hidden;
  }
  .item::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--gold); }
  .item h2{
    font-family:'Lora',serif; font-size:19px; font-weight:600; color:var(--navy); margin:0 0 6px;
  }
  .item p{ margin:0 0 14px; color:var(--slate); font-size:14px; line-height:1.5; }
  .btn{
    display:inline-block; padding:10px 18px; border-radius:10px; background:var(--celeste);
    color:var(--navy); text-decoration:none; font-weight:600; font-size:13.5px;
    margin-right:8px; margin-bottom:6px;
  }
  .btn:hover{ background:var(--celeste-line); }
  .btn.primary{ background:var(--gold); color:var(--navy-deep); }
  .btn.primary:hover{ background:var(--gold-deep); }
</style>
</head>
<body>

<header>
  <a href="index.html" class="backlink">← Inicio</a>
  <p class="eyebrow">Cátedra Saravia · Sistemas Administrativos</p>
  <h1>Casos Prácticos</h1>
</header>

<main id="casos-root"></main>

<script type="application/json" id="casos-base">{"casos": [{"titulo": "Havanna", "archivo": "caso_1_havanna.pdf", "form": "https://forms.cloud.microsoft/r/fbZpRKGeTd"}, {"titulo": "¡Helado, Helado!", "archivo": "caso_2_helado.pdf", "form": "https://forms.cloud.microsoft/r/RcHejP53iv"}, {"titulo": "El Almacén", "archivo": "caso_3_el_almacen.pdf", "form": ""}, {"titulo": "El Almacén V2", "archivo": "caso_3_el_almacen_v2.pdf", "form": ""}, {"titulo": "Sanatorios San Gabriel", "archivo": "caso_4_sanatorio_san_gabriel.pdf", "form": ""}, {"titulo": "Nutribaby", "archivo": "caso_5_nutribaby.pdf", "form": ""}, {"titulo": "Bloque", "archivo": "caso_6_bloque.pdf", "form": ""}]}</script>
<script>
// Los casos de base están embebidos arriba; si existe casos_data.json (lo guarda el admin), se usa ese.
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hrefArchivo(a){ return /\.pdf$/i.test(a) ? 'web/viewer.html?file=../' + a + '#page=1' : a; }
function render(casos){
  document.getElementById('casos-root').innerHTML = casos.map(c => `
  <div class="item">
    <h2>${esc(c.titulo)}</h2>
    ${c.archivo ? `<a class="btn primary" href="${esc(hrefArchivo(c.archivo))}">Abrir consignas</a>` : ''}
    ${c.form ? `<a class="btn" href="${esc(c.form)}" target="_blank" rel="noopener">Completar formulario</a>` : ''}
  </div>`).join('');
}
render(JSON.parse(document.getElementById('casos-base').textContent).casos);
fetch('casos_data.json?v=' + Date.now())
  .then(r => r.ok ? r.json() : null)
  .then(d => { if(d && Array.isArray(d.casos)) render(d.casos); })
  .catch(() => {});
</script>

</body>
</html>
